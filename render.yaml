# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fantasy-analyzer-api
    runtime: python
    plan: starter # always on, 0.5 CPU / 512 MB (upgraded 2026-11-06)
    buildCommand: pip install uv && uv sync --locked --no-dev
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Comma-separated web origins allowed to call the API, e.g. https://fantasy-analyzer-web.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Postgres for the trade of the day and its poll, e.g. a free Neon database. Optional.
      - key: DATABASE_URL
        sync: false
      # Signs the team verification codes. Render generates a random value.
      - key: SECRET_KEY
        generateValue: true
      # Google OAuth web client ID. Google sign-in stays off until it is set.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Resend API key. Forgot password stays off until it is set; the sender's domain must be verified in Resend.
      - key: RESEND_API_KEY
        sync: false
      # Optional: reset emails come from "COURT <no-reply@courtfantasy.app>" and link to https://courtfantasy.app.
      - key: EMAIL_FROM
        sync: false
      - key: SITE_URL
        sync: false
      # Anthropic API key. Claude Haiku reads managers' notes on trade ideas; notes stay unread until it is set.
      - key: ANTHROPIC_API_KEY
        sync: false
      # A public ESPN 9-cat league shown, team names masked, to visitors before they sign in.
      # Analysed once a day (.github/workflows/sample.yml). The sample stays off until it is set.
      - key: SAMPLE_LEAGUE_ID
        sync: false

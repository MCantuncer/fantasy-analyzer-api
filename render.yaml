# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fantasy-analyzer-api
    runtime: python
    plan: free # change to "starter" for an always-on server
    buildCommand: pip install uv && uv sync --locked --no-dev
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Comma-separated web origins allowed to call the API, e.g. https://fantasy-analyzer-web.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Postgres for the trade of the day and its poll, e.g. a free Neon database. Optional.
      - key: DATABASE_URL
        sync: false

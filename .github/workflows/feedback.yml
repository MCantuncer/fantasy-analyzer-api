name: Feedback deep read

# Hourly: collects Opus's closer reads of unclear trade-idea notes and sends new ones in
# a batch. Does nothing until the API has ANTHROPIC_API_KEY.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - run: curl -fsS --max-time 90 -o /dev/null "${{ vars.API_URL }}/api/feedback/deep-read" || true

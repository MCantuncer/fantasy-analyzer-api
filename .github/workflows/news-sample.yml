name: News feed sample

# One-off (run 15): what Bluesky posts look like (Scottie Barnes news stuck 6 days old).
on:
  push:
    branches: [feature/news-feed-sample]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          path: probe
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: PYTHONPATH=. uv run python probe/scripts/bsky_probe.py

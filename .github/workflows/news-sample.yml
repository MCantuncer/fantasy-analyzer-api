name: News feed sample

# One-off (run 6): why ESPN and HoopsHype fail, using the app's own fetch.
on:
  push:
    branches: [feature/news-feed-sample]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: |
          uv run python - <<'PY'
          import asyncio, httpx
          from app.news.sources import BY_ID, fetch, USER_AGENT
          async def main():
              for sid in ["espn", "hoopshype", "rotowire"]:
                  s = BY_ID[sid]
                  try:
                      items = await fetch(s)
                      print("OK", sid, len(items))
                  except Exception as e:
                      print("ERR", sid, type(e).__name__, e)
                  async with httpx.AsyncClient(follow_redirects=True, headers={"User-Agent": USER_AGENT}, timeout=12) as h:
                      r = await h.get(s.url)
                      print("   ", r.status_code, r.url, [str(x.url) for x in r.history], len(r.content), r.headers.get("content-type"))
          asyncio.run(main())
          PY

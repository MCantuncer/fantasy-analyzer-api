name: News feed sample

# One-off (run 6): why ESPN and HoopsHype fail, using the app's own fetch.
on:
  push:
    branches: [feature/news-feed-sample]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: |
          uv run python - <<'PY'
          import asyncio, httpx
          from app.news.sources import BY_ID, fetch, USER_AGENT
          async def main():
              uas = {"app": USER_AGENT, "mozilla_app": "Mozilla/5.0 (compatible; fantasy-analyzer/1.0; +https://fantasy-analyzer-web.vercel.app)", "probe": "Mozilla/5.0 (fantasy-analyzer news probe)", "none": "python-httpx"}
              for name, ua in uas.items():
                  async with httpx.AsyncClient(follow_redirects=True, headers={"User-Agent": ua}, timeout=12) as h:
                      r = await h.get(BY_ID["espn"].url)
                      print("ESPN", name, r.status_code, len(r.content))
              ua = uas["mozilla_app"]
              for u in ["https://hoopshype.com/feed/", "https://www.hoopshype.com/feed/", "https://hoopshype.com/rss/", "https://www.hoopshype.com/rss/", "https://hoopshype.com/rumors/feed/", "https://www.hoopshype.com/feed/rss/", "https://www.hoopshype.com/rss.xml", "https://www.hoopshype.com/feeds/all.xml", "https://www.hoopshype.com/sitemap.xml", "https://www.hoopshype.com/"]:
                  async with httpx.AsyncClient(follow_redirects=True, headers={"User-Agent": ua}, timeout=12) as h:
                      try:
                          r = await h.get(u)
                          import re
                          alt = re.findall(r'<link[^>]+(?:rss|atom)\+xml[^>]*>', r.text)[:4]
                          print("HH", u, r.status_code, r.url, r.headers.get("content-type"), len(r.content), alt)
                      except Exception as e:
                          print("HH", u, "ERR", e)
          asyncio.run(main())
          PY
